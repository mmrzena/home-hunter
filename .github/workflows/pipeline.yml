# Manual fallback runner. The daily schedule lives in vercel.json (Vercel Cron →
# /api/cron/pipeline → Workflow SDK). Both resume the same Postgres checkpoints
# (pipeline_runs), so this picks up a stuck cloud run where it stopped.
#
# Setup: repo secret DATABASE_URL = the Neon pooled connection string.
name: pipeline

on:
  workflow_dispatch: {} # manual "Run workflow" button

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # A full run from scratch takes well over an hour; the job exits as soon as
    # the pipeline reaches "done".
    timeout-minutes: 180
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # A touch faster than the 1200 ms local default — still polite for a
      # once-nightly job, and trims a big chunk off the paced ingest.
      REQUEST_DELAY_MS: "700"
      # Optional: cap pages per region per source if a run still runs long.
      # INGEST_MAX_PAGES: "40"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run pipeline
